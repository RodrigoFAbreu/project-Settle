# Serves Settle's built site (the release ZIP) as a static single-page app.
# Runs as the unprivileged nginx user (101) with a read-only root filesystem:
# every writable path is under /tmp. The Content-Security-Policy ships inside
# index.html (app/cspMeta.ts) and is deliberately not duplicated or altered here.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  # nginx's table lacks these; ES-module workers and the PWA manifest need them.
  types {
    text/javascript mjs;
    application/manifest+json webmanifest;
    application/octet-stream onnx;
    font/ttf ttf;
    text/plain md;
  }
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  server_tokens off;
  keepalive_timeout 30;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json
             application/manifest+json application/wasm image/svg+xml text/plain;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Application routes (path-based, ADR 0001 D11) fall back to the shell.
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      try_files $uri /index.html;
    }

    # Build output and vendored runtime/models: a missing file is a real 404,
    # never index.html (a worker or WASM loader must not receive HTML).
    # Vite hashes /assets/ names, so they are immutable.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      try_files $uri =404;
    }

    # Not content-hashed: revalidate (ETag) so an upgrade is picked up.
    location ~ ^/(vendor|icons)/ {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      try_files $uri =404;
    }
  }
}
