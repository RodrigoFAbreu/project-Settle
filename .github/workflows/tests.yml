name: Tests

# Everything that checks a commit before it can be merged or released. Called by
# ci.yml; also runnable alone from the Actions tab.
#
#   app    the web app (app/) and shared/, the domain code it imports (the
#          checks run from app/ and cover both): typecheck, lint, format, unit
#          tests, build and the browser smoke test. workflow-conformance.yml, which covers the workflow
#          tooling at the repository root, is separate.
#   image  the container image (container/), built as the release builds it but
#          from this commit's own app build instead of a published ZIP, on a
#          native ARM64 runner, then smoke-tested under the homelab web-app
#          chart's constraints. A change to container/ is therefore checked on
#          its pull request, not first on release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App (checks, build, browser smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, every branch and tag: the test that no real
          # receipt is in any commit (R17) refuses to pass on a shallow
          # clone, since it would miss one committed and then deleted.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The PaddleOCR models (M2.5 plan, P5), downloaded by
      # scripts/vendor-paddle.mjs, which pins their revision and SHA-256s:
      # the key follows that file, so a changed pin downloads afresh and a
      # restored file is still checked against its hash.
      - uses: actions/cache@v6
        with:
          path: app/.paddle-models
          key: paddle-models-${{ hashFiles('app/scripts/vendor-paddle.mjs') }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The build, with one ONNX Runtime wasm under vendor/ort/ (M2.5, P4)
      # and no Tesseract file (P10).
      - run: npm run build
      - run: node scripts/check-build.mjs
      # The browser smoke test (M2.5, CP4): the runner's Chrome scans two
      # committed samples through the real app (the worker, the wasm and
      # model paths, Vite's bundling, the browser's pixels, the CSP), and
      # each imported bill must match its sample by P2, with no request
      # carrying a receipt value. Ubuntu 24.04 restricts the unprivileged
      # user namespaces Chrome's sandbox needs; this lifts that for the job.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test, sample 1 (a JPEG photo with a fiscal QR code)
        run: >-
          node scripts/check-requests.mjs scan
          --file src/features/receipt/fixtures/browser/sample-1.jpg
          --values src/features/receipt/fixtures/browser/sample-1.expected.json
          --expect-bill src/features/receipt/fixtures/browser/sample-1.expected.json
          --brave "$(command -v google-chrome)"
      - name: Smoke test, sample 12 (a supermarket photo)
        run: >-
          node scripts/check-requests.mjs scan
          --file src/features/receipt/fixtures/browser/sample-12.jpg
          --values src/features/receipt/fixtures/browser/sample-12.expected.json
          --expect-bill src/features/receipt/fixtures/browser/sample-12.expected.json
          --brave "$(command -v google-chrome)"
      # The smoke test can fail: with a wrong expected bill (one price
      # changed), the same scan must fail on the bill, and on nothing else.
      - name: Smoke test, a wrong expected bill fails
        run: |
          node -e "
            const fs = require('node:fs')
            const file = 'src/features/receipt/fixtures/browser/sample-1.expected.json'
            const expected = JSON.parse(fs.readFileSync(file, 'utf8'))
            expected.items[0].lineTotal = '3.10'
            fs.writeFileSync('/tmp/sample-1.wrong.json', JSON.stringify(expected))
          "
          if node scripts/check-requests.mjs scan \
            --file src/features/receipt/fixtures/browser/sample-1.jpg \
            --values src/features/receipt/fixtures/browser/sample-1.expected.json \
            --expect-bill /tmp/sample-1.wrong.json \
            --out /tmp/wrong.json --brave "$(command -v google-chrome)"; then
            echo 'A wrong expected bill passed'; exit 1
          fi
          node -e "
            const report = JSON.parse(require('node:fs').readFileSync('/tmp/wrong.json', 'utf8'))
            const onlyTheBill = report.expectBill?.noEditNeeded === false &&
              report.failures.length === 0 && report.proxyFailures.length === 0 &&
              report.cspViolations.length === 0
            if (!onlyTheBill) { console.error(JSON.stringify(report.expectBill)); process.exit(1) }
          "

  image:
    name: Image (ARM64 build and smoke test)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck container/smoke-test.sh scripts/release/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The PaddleOCR models, downloaded by scripts/vendor-paddle.mjs (see the app job).
      - uses: actions/cache@v6
        with:
          path: app/.paddle-models
          key: paddle-models-${{ hashFiles('app/scripts/vendor-paddle.mjs') }}
      - uses: docker/setup-buildx-action@v4
      # The release's own build and checks (scripts/release), then the image from the ZIP.
      - name: Build and verify the release ZIP as the release does
        run: |
          scripts/release/build.sh 0.0.0-ci
          scripts/release/verify.sh dist/settle-v0.0.0-ci.zip
      - name: Build the image from this commit's build, as the release does
        run: |
          mkdir "$RUNNER_TEMP/context"
          cp dist/settle-v0.0.0-ci.zip "$RUNNER_TEMP/context/settle.zip"
          cp container/Dockerfile container/nginx.conf "$RUNNER_TEMP/context/"
          docker buildx build --platform linux/arm64 --load \
            --build-arg "SETTLE_VERSION=0.0.0-ci" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --tag settle:ci "$RUNNER_TEMP/context"
      - name: Smoke test
        run: container/smoke-test.sh settle:ci "$RUNNER_TEMP/context/settle.zip"

  release-policy:
    name: Release policy tests
    uses: RodrigoFAbreu/action-workflows/.github/workflows/python-tests.yml@main
    with:
      python-version: "3.12"
      test-directory: scripts/release
      test-pattern: "test_*.py"

  backlog:
    name: Backlog page is fresh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/workflow_backlog.py check
