# Every PR must say what it adds, as a Conventional Commit title such as
# "feat(m1): bill splitter" or "fix: rounding in allocate". The release
# workflow reads these titles to choose the version bump. The check itself is
# the shared RodrigoFAbreu/action-workflows pr-title.yml. A workflow of its own,
# outside ci.yml, so a title edit re-runs it without repeating the build.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    uses: RodrigoFAbreu/action-workflows/.github/workflows/pr-title.yml@main
  # Named for the required check, so a change to the jobs above never touches
  # branch protection.
  required:
    name: Conventional Commit title
    needs: title
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.title.result }}
        run: test "$RESULT" = success
