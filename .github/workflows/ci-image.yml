name: CI - Image

# The homelab container image (container/), built as the release builds it but
# from this commit's own app build instead of a published ZIP, on a native
# ARM64 runner, then smoke-tested under the homelab web-app chart's constraints.
# A change to container/ is therefore checked on its pull request, not first on
# release. Called by ci.yml; also runnable alone from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image (ARM64 build and smoke test)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck container/smoke-test.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The PaddleOCR models, downloaded by scripts/vendor-paddle.mjs (see ci-app.yml).
      - uses: actions/cache@v6
        with:
          path: app/.paddle-models
          key: paddle-models-${{ hashFiles('app/scripts/vendor-paddle.mjs') }}
      - run: npm run build
        working-directory: app
      - uses: docker/setup-buildx-action@v4
      - name: Build the image from this commit's build, as the release does
        run: |
          mkdir "$RUNNER_TEMP/context"
          (cd app/dist && zip -qr "$RUNNER_TEMP/context/settle.zip" .)
          cp container/Dockerfile container/nginx.conf "$RUNNER_TEMP/context/"
          docker buildx build --platform linux/arm64 --load \
            --build-arg "SETTLE_VERSION=0.0.0-ci" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --tag settle:ci "$RUNNER_TEMP/context"
      - name: Smoke test
        run: container/smoke-test.sh settle:ci "$RUNNER_TEMP/context/settle.zip"
